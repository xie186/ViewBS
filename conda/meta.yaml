{% set version = "0.2.0a0" %}

package:
  name: viewbs
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: |
    cargo install --locked --path . --root "${PREFIX}" --features cli,plots,serde
    rm -f "${PREFIX}/.crates.toml" "${PREFIX}/.crates2.json"

requirements:
  build:
    - {{ compiler('rust') }}

test:
  commands:
    - ViewBS --version
    - ViewBS --help
    - ViewBS GlobalMethLev --help

about:
  home: https://github.com/xie186/ViewBS
  license: GPL-3.0-only
  license_file: license.txt
  summary: Rust command-line and library toolkit for bisulfite sequencing methylation analysis

extra:
  recipe-maintainers:
    - xie186
