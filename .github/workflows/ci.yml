name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - rust-rewrite
      - viewbs-rs
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    name: Tier 0 format, lint, compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile benchmarks
        run: cargo bench --bench performance --all-features --no-run

  test-features:
    name: Test ${{ matrix.features }}
    runs-on: ubuntu-latest
    needs: tier0
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            command: cargo test
          - features: no-default-features
            command: cargo test --no-default-features
          - features: all-features
            command: cargo test --all-features
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: ${{ matrix.command }}

  cross-platform-smoke:
    name: Tier 6 smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: tier0
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build ViewBS
        run: cargo build --all-features

      - name: Run CLI smoke tests
        run: cargo test --all-features --test cli_integration

      - name: Run indexed API smoke test
        run: cargo test --all-features --test indexed_commands_api meth_one_region_queries_tabix_and_writes_context_table
